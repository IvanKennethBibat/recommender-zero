name: Deploy

# Runs after CI passes on main (or by hand) and redeploys the server through the SSM deploy document from terraform/.
# Needs repository variables AWS_DEPLOY_ROLE_ARN, AWS_REGION, DEPLOY_INSTANCE_ID and DEPLOY_DOCUMENT_NAME (terraform output);
# skipped when they aren't set, so fresh clones of the template don't fail. Optional DEPLOY_HEALTH_URL is checked after each deploy.
# To roll back, run this workflow by hand with an earlier commit SHA from main (each deploy log prints the previous one).
on:
  workflow_run:
    workflows: ["Pull Requests CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA on main to deploy (leave empty for the latest main)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      DOCUMENT_NAME: ${{ vars.DEPLOY_DOCUMENT_NAME }}
      COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
      HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}

    steps:
      # The server also refuses SHAs that aren't on main; this just fails early with a clearer message
      - name: Check commit SHA
        run: |
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit must be a full 40-character SHA, got '$COMMIT'"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy on the server
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT_NAME" \
            --parameters "commit=$COMMIT" \
            --comment "Deploy $COMMIT" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id deploying $COMMIT"

          # Poll instead of 'aws ssm wait', which gives up after about 100 seconds; builds can take longer
          for _ in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = "Success" ]

      # Checks the API from the outside (DNS, certificate, Traefik, app and database via /ready), not just container health
      - name: Check the API is healthy
        if: env.HEALTH_URL != ''
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "$HEALTH_URL"; then
              echo
              echo "Healthy: $HEALTH_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTH_URL wasn't healthy 2 minutes after deploying $COMMIT. Roll back by running Deploy with the 'Previously deployed' SHA from the log above."
          exit 1
