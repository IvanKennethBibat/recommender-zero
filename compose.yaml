services:
  db:
    image: postgres:16.15
    container_name: task_api_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dumps the database every BACKUP_INTERVAL_SECONDS into backup_data; the prod overlay also uploads each dump to S3
  backup:
    image: task-api-backup:${IMAGE_TAG:-latest}
    build: ./backup
    container_name: task_api_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - backup_data:/backups
    networks:
      - default

  # Applies pending Alembic migrations once, then exits; the API only starts if this succeeds
  migrate:
    image: task-api-api:${IMAGE_TAG:-latest}
    build: .
    container_name: task_api_migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    # Same image as the API; its HTTP healthcheck doesn't apply to a one-off migration
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - default

  api:
    image: task-api-api:${IMAGE_TAG:-latest}
    build: .
    container_name: task_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - default

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: task_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=/prometheus"
      - "--web.route-prefix=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - default

  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: task_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:?set GF_SERVER_ROOT_URL in .env}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  backup_data:
  grafana_data:
  prometheus_data:
