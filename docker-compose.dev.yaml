services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    environment:
      ENABLE_DOCS: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.auth.rule=Path(`/login`) || Path(`/register`)"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.routers.auth.middlewares=auth-ratelimit"
      - "traefik.http.routers.auth.service=api"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.burst=5"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  prometheus:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-network

  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:80:80"
    networks:
      - socket-proxy-network
      - default
    depends_on:
      - socket-proxy

networks:
  socket-proxy-network:
    driver: bridge
    internal: true
