services:
  api:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN:?set DOMAIN in .env}`) && !PathPrefix(`/metrics`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.auth.rule=Host(`${DOMAIN:?set DOMAIN in .env}`) && (Path(`/login`) || Path(`/register`))"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"
      - "traefik.http.routers.auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.auth.middlewares=auth-ratelimit"
      - "traefik.http.routers.auth.service=api"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.burst=5"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  # Grafana and Prometheus aren't routed through Traefik in production: they listen on the server's loopback only,
  # and are reached through an SSM port-forwarding session (see README), so no admin login is exposed publicly
  grafana:
    ports:
      - "127.0.0.1:3000:3000"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  # Credentials come from the EC2 instance role (see terraform/), so no AWS keys are stored here
  backup:
    environment:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET in .env (terraform output backup_bucket)}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION in .env (terraform output aws_region)}

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: task_socket_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-network

  traefik:
    image: traefik:v3.7.14
    container_name: task_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # DNS challenge through Cloudflare: certificates are issued without inbound traffic, so it works before DNS points here
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
    environment:
      # Cloudflare API token with Zone:DNS:Edit on the domain's zone
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
    networks:
      - socket-proxy-network
      - default
    depends_on:
      - socket-proxy

networks:
  socket-proxy-network:
    driver: bridge
    internal: true

volumes:
  traefik_letsencrypt:
